server {
    listen 8080;
    server_name _;
    # No URI, IP, query, cookie or request body in local gateway logs.
    access_log off;
    error_log /dev/null;
    add_header Referrer-Policy "no-referrer" always;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/admin/order-events/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    # Four images of up to 6 MiB plus multipart framing. Other routes keep 1 MiB.
    location ~ "^/api/v1/admin/catalog/products/[0-9a-fA-F-]{36}/images$" {
        client_max_body_size 26m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite, never append an address supplied by an untrusted client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }
}
