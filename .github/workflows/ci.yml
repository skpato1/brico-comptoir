name: Build, integration and browser tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Publication check also examines reachable Git history.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Repository and configuration checks
        run: |
          node scripts/check-repository.mjs
          node --test scripts/release-checks.test.mjs
          node scripts/check-release.mjs
          node scripts/init-local-env.mjs
          docker compose config --quiet
      - name: Start real MinIO
        run: docker compose up --build --detach --wait --wait-timeout 240 minio
      - name: Java build, unit tests, ArchUnit and PostgreSQL/MinIO integration
        working-directory: backend
        env:
          BRICO_LOCAL_MINIO_TEST: 'true'
        run: |
          node --input-type=module -e '
            import {loadEnvFile} from "node:process";
            import {spawnSync} from "node:child_process";
            loadEnvFile("../.env");
            const env={...process.env,MEDIA_ENDPOINT:"http://localhost:9000",MEDIA_ACCESS_KEY:process.env.MINIO_ROOT_USER,MEDIA_SECRET_KEY:process.env.MINIO_ROOT_PASSWORD};
            process.exit(spawnSync("sh",["./mvnw","-B","-ntp","verify"],{env,stdio:"inherit"}).status ?? 1);'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/failsafe-reports/*.xml
          retention-days: 7
      - name: Stop test infrastructure
        if: always()
        run: docker compose down

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Deployment routing regression tests
        run: node --test ../scripts/vercel-output.test.mjs
      - name: Angular production build and Vercel artifact
        env:
          BRICO_API_ORIGIN: https://api.example.com
        run: node ../scripts/build-vercel.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - name: Install the pinned Chromium browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Build and initialize isolated Compose stack
        run: node scripts/e2e.mjs up
      - name: Real purchases, administration, images, SMTP recovery, SSE and permissions
        run: node scripts/e2e.mjs test
      - name: PostgreSQL and MinIO backup/restore drill
        run: node scripts/check-restore.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-test-reports
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: node scripts/e2e.mjs down
