name: bricocomptoir

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bricocomptoir}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/init-local-env.mjs}
      DB_USERNAME: ${DB_USERNAME:-brico_app}
      DB_PASSWORD: ${DB_PASSWORD:?Local application password required}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-brico_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Local migration password required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: bricocomptoir/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-brico_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Local MinIO password required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.2
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bricocomptoir}
      DB_USERNAME: ${DB_USERNAME:-brico_app}
      DB_PASSWORD: ${DB_PASSWORD:?Local application password required}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-brico_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Local migration password required}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: noreply@bricocomptoir.local
      MAIL_OUTBOX_KEY: ${MAIL_OUTBOX_KEY:?Run node scripts/init-local-env.mjs}
      DATA_ARCHIVE_KEY: ${DATA_ARCHIVE_KEY:?Run node scripts/init-local-env.mjs}
      PRIVACY_LEGAL_DAYS: ${PRIVACY_LEGAL_DAYS:-0}
      PRIVACY_CONTACT_DAYS: ${PRIVACY_CONTACT_DAYS:-90}
      PRIVACY_CART_DAYS: ${PRIVACY_CART_DAYS:-30}
      PRIVACY_MAIL_DAYS: ${PRIVACY_MAIL_DAYS:-30}
      PRIVACY_AUDIT_DAYS: ${PRIVACY_AUDIT_DAYS:-365}
      PRIVACY_RETENTION_ENABLED: ${PRIVACY_RETENTION_ENABLED:-false}
      APP_PUBLIC_URL: http://localhost:${FRONTEND_PORT:-4200}
      # Local demonstration only: validate commercial fees/zones before opening.
      CHECKOUT_DELIVERY_FEE_TND: ${CHECKOUT_DELIVERY_FEE_TND:-7.000}
      CHECKOUT_GOVERNORATES: ${CHECKOUT_GOVERNORATES:-TUNIS,SFAX}
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_ACCESS_KEY: ${MINIO_ROOT_USER:-brico_local}
      MEDIA_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Local MinIO password required}
      MEDIA_BUCKET: bricocomptoir-media
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/health/readiness"]
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 20

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-test:
    profiles: ["tools"]
    mem_limit: 1536m
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace
    entrypoint: ["sh", "./mvnw"]
    command: ["-B", "verify"]
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      JAVA_TOOL_OPTIONS: -Xmx512m
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_ACCESS_KEY: ${MINIO_ROOT_USER:-brico_local}
      MEDIA_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Local MinIO password required}
      BRICO_LOCAL_MINIO_TEST: ${BRICO_LOCAL_MINIO_TEST:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
  maven-cache:
